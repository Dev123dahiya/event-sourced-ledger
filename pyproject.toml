[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-sourced-ledger"
version = "0.1.0"
description = "Double-entry ledger with an append-only event log as the source of truth"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["ledger"]
